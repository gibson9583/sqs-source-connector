# Publishes the SQS connector to GitHub Releases in the shape the OIE Community
# Store expects (the extension zip plus its .sha256 sidecar) on a semver tag, then
# opens a community-catalog PR so the store offers it.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# versions:set makes the tag the source of truth so plugin.xml's pluginVersion and
# the jar names match oie.json (otherwise the engine reports a stale version and the
# store shows a perpetual update). Requires a CATALOG_TOKEN repo secret (fine-grained
# PAT with Contents + Pull requests on the catalog repo) for the catalog PR.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # required to create the GitHub Release

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
      minengine: ${{ steps.pkg.outputs.minengine }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11 for CodeSignTool
        id: codesign-java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check CodeSignTool JAR compatibility without credentials
        env:
          CODESIGNTOOL_JAVA: ${{ steps.codesign-java.outputs.path }}/bin/java
        run: python3 .github/signing/sign_release.py --check-tool

      - name: Check SSL.com signing configuration
        env:
          CODESIGNTOOL_JAVA: ${{ steps.codesign-java.outputs.path }}/bin/java
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CERT_SHA256: ${{ vars.SSL_COM_CERT_SHA256 }}
        run: python3 .github/signing/sign_release.py --check-config

      # Derive the version from the tag and fail fast if oie.json disagrees.
      - name: Resolve and verify version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION="$(jq -r .version oie.json)"
          MANIFEST_VERSION="${MANIFEST_VERSION#v}"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG implies version $VERSION but oie.json says $MANIFEST_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Builds every module and assembles package/target/sqs-connector-<version>.zip.
      # (The package module builds the web-admin plugin via frontend-maven-plugin.)
      # versions:set makes the tag the source of truth so plugin.xml's pluginVersion
      # matches oie.json — otherwise the engine reports the pom version as "installed"
      # and the store shows a perpetual update.
      - name: Build extension zip
        run: |
          mvn -B -ntp versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DprocessAllModules=true -DgenerateBackupPoms=false
          mvn -B -ntp clean verify
          python3 tools/check_package.py

      - name: Sign and verify release JARs with SSL.com
        env:
          CODESIGNTOOL_JAVA: ${{ steps.codesign-java.outputs.path }}/bin/java
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CERT_SHA256: ${{ vars.SSL_COM_CERT_SHA256 }}
        run: python3 .github/signing/sign_release.py

      - name: Stage the release asset and checksum
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Use whichever sqs-connector zip the build produced (named from the Maven
          # project version) and publish it under the tag-matched asset name.
          SRC="$(find package/target -maxdepth 1 -name 'sqs-connector-*.zip' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "::error::No sqs-connector zip found in package/target"; ls -l package/target || true; exit 1
          fi
          ASSET="sqs-connector-${VERSION}.zip"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "out/${ASSET}.sha256")" >> "$GITHUB_OUTPUT"
          echo "minengine=$(jq -r '.minEngineVersion // "4.6.0"' oie.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/${{ steps.pkg.outputs.asset }}
            out/${{ steps.pkg.outputs.asset }}.sha256
          # Tags like v1.0.0-rc1 publish as pre-releases (store beta channel only).
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Opens a PR against the community catalog with this release's manifest — catalog
  # CI digest-verifies before merge, and the index rebuild on merge makes connected
  # engines offer the update on their next sync. Connectors live under
  # manifests/connectors/<id>/.
  catalog-manifest:
    needs: release
    runs-on: ubuntu-latest
    env:
      CATALOG_REPO: gibson9583/oie-community-catalog
      PLUGIN_ID: sqs-connector
      TYPE_DIR: connectors
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      MIN_ENGINE: ${{ needs.release.outputs.minengine }}
      GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
    steps:
      - name: Require the catalog token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CATALOG_TOKEN secret is not set — cannot open the catalog PR. Add a fine-grained PAT with Contents+Pull requests access to $CATALOG_REPO."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: gibson9583/oie-community-catalog
          token: ${{ secrets.CATALOG_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write the package meta.json (from the connector's oie.json)
        run: |
          mkdir -p "manifests/${TYPE_DIR}/${PLUGIN_ID}"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/oie.json" -o /tmp/oie.json
          node -e '
            const o = JSON.parse(require("fs").readFileSync("/tmp/oie.json","utf8"));
            const meta = {
              id: o.id, name: o.name, description: o.description, type: o.type,
              publisher: (o.authors && o.authors[0]) || o.id,
              repository: o.homepage, homepage: o.homepage, documentation: o.documentation,
              license: o.license, authors: o.authors || [], keywords: o.keywords || [],
              deprecated: !!o.deprecated
            };
            require("fs").writeFileSync(process.env.META_PATH, JSON.stringify(meta, null, 4) + "\n");
          '
        env:
          META_PATH: manifests/${{ env.TYPE_DIR }}/${{ env.PLUGIN_ID }}/meta.json

      - name: Write the version manifest
        run: |
          mkdir -p "manifests/${TYPE_DIR}/${PLUGIN_ID}"
          cat > "manifests/${TYPE_DIR}/${PLUGIN_ID}/${VERSION}.json" <<EOF
          {
              "version": "${VERSION}",
              "minEngineVersion": "${MIN_ENGINE}",
              "maxEngineVersion": null,
              "installerUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${PLUGIN_ID}-${VERSION}.zip",
              "sha256": "${SHA256}",
              "restartRequired": true,
              "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "releaseNotesUrl": "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}",
              "docsUrl": "https://raw.githubusercontent.com/${{ github.repository }}/v${VERSION}/docs/store.md"
          }
          EOF
          # Carry the ui surfaces declared by the tagged oie.json (downloaded by the
          # meta.json step above); omit the key entirely when oie.json has no ui.
          UI="$(jq -c '.ui // empty' /tmp/oie.json)"
          if [ -n "$UI" ]; then
            jq --indent 4 --argjson ui "$UI" '. + {ui: $ui}' \
              "manifests/${TYPE_DIR}/${PLUGIN_ID}/${VERSION}.json" > /tmp/version-manifest.json
            mv /tmp/version-manifest.json "manifests/${TYPE_DIR}/${PLUGIN_ID}/${VERSION}.json"
          fi

      - name: Validate (schema + digest download)
        run: node scripts/build-index.mjs --lint --verify "manifests/${TYPE_DIR}/${PLUGIN_ID}/${VERSION}.json"

      - name: Open the catalog PR
        run: |
          BRANCH="${PLUGIN_ID}-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manifests
          git commit -m "${PLUGIN_ID} ${VERSION}"
          git push -f origin "$BRANCH"
          if gh pr list -R "$CATALOG_REPO" --head "$BRANCH" --json number -q '.[0].number' | grep -q .; then
            echo "PR already open for $BRANCH — branch updated."
          else
            gh pr create -R "$CATALOG_REPO" --head "$BRANCH" \
              --title "${PLUGIN_ID} ${VERSION}" \
              --body "Automated manifest for [${PLUGIN_ID} v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}). Digest verified against the release asset by catalog CI."
          fi
